<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>jb80-afk</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1418;
    --bar: #151e24;
    --field: #1f2b32;
    --mine: #2b4a50;
    --mine-text: #e6f0ef;
    --theirs: #232e37;
    --theirs-text: #e2e8ec;
    --muted: #8a9fa6;
    --accent: #8fd0cc;
    --gold: #d6b67a;
    --danger: #e0877f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--theirs-text); overflow: hidden; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  button:focus-visible, textarea:focus-visible, .bubble:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Layar login */
  #login-screen {
    height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; text-align: center; color: #e6eef0;
  }
  #login-screen img { width: 88px; height: 88px; border-radius: 22px; }
  #login-screen h1 { font-size: 1.6rem; font-weight: 700; }
  #login-screen p { max-width: 30ch; color: var(--muted); line-height: 1.5; }
  .btn { border: 0; border-radius: 999px; padding: 13px 24px; font-weight: 600; background: var(--accent); color: #0e1418; cursor: pointer; }
  #login-error { color: var(--danger); min-height: 1.4em; font-size: .95rem; max-width: 34ch; }

  /* Layar chat */
  #app { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; background: var(--bg); }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    background: var(--bar); border-bottom: 1px solid #1d2a31;
  }
  header .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--mine); color: var(--mine-text); display: grid; place-items: center; font-weight: 700; }
  header .title { flex: 1; min-width: 0; }
  header .title strong { display: block; font-size: 1.02rem; }
  header .title span { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  header button { background: transparent; border: 1px solid #2c3d45; color: #c5d3d6; border-radius: 999px; padding: 7px 14px; font-size: .85rem; cursor: pointer; }

  #chat {
    flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 4px;
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .day { align-self: center; margin: 10px 0 6px; font-size: .75rem; color: var(--muted); background: #18232a; padding: 4px 12px; border-radius: 999px; }
  .row { display: flex; border-radius: 14px; }
  .row.mine { justify-content: flex-end; }
  .bubble {
    max-width: 82%; padding: 7px 10px 6px; border-radius: 14px; line-height: 1.38;
    overflow-wrap: anywhere; white-space: pre-wrap; cursor: pointer;
  }
  .mine .bubble { background: var(--mine); color: var(--mine-text); border-bottom-right-radius: 4px; }
  .theirs .bubble { background: var(--theirs); color: var(--theirs-text); border-bottom-left-radius: 4px; }
  .who { display: block; font-size: .72rem; font-weight: 700; color: var(--gold); margin-bottom: 2px; }
  .time { float: right; margin: 6px 0 0 12px; font-size: .68rem; color: var(--muted); }
  .mine .time { color: #9bbcbd; }
  .deleted { font-style: italic; color: var(--muted); }
  .bubble.is-deleted { cursor: default; background: transparent; border: 1px dashed #2c3d45; box-shadow: none; }

  .quote {
    display: block; margin: 0 0 5px; padding: 5px 8px; border-radius: 8px; font-size: .85rem;
    background: rgba(0,0,0,.22); border-left: 3px solid var(--gold); cursor: pointer; white-space: normal;
  }
  .mine .quote { border-left-color: var(--accent); }
  .quote b { display: block; font-size: .72rem; color: var(--gold); }
  .mine .quote b { color: var(--accent); }
  .quote span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #c3cfd3; }
  .quote .gone { font-style: italic; color: var(--muted); }

  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: rgba(143,208,204,.28); } 100% { background: transparent; } }

  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 28ch; line-height: 1.5; }

  /* Menu aksi pesan */
  #menu {
    position: fixed; z-index: 20; min-width: 150px; padding: 6px; border-radius: 14px;
    background: #1c2830; border: 1px solid #2c3d45; box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  #menu button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 10px 12px; border-radius: 9px; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: #26363f; }
  #menu .danger { color: var(--danger); }

  /* Bar balas / edit */
  #modebar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bar); border-top: 1px solid #1d2a31; }
  #modebar .mb-text { flex: 1; min-width: 0; border-left: 3px solid var(--accent); padding-left: 10px; }
  #modebar strong { display: block; font-size: .8rem; color: var(--accent); }
  #modebar span { display: block; font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mb-close { background: transparent; border: 0; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; color: var(--muted); }
  #mb-close:hover { background: #26363f; }

  form {
    display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--bar);
  }
  textarea {
    flex: 1; resize: none; border: 0; border-radius: 20px; padding: 11px 15px; font: inherit;
    max-height: 120px; background: var(--field); color: #e7eef0;
  }
  textarea::placeholder { color: #70868d; }
  #send { width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; cursor: pointer; background: var(--accent); color: #0e1418; display: grid; place-items: center; }
  #send:disabled { opacity: .45; cursor: default; }

  /* Lampiran */
  #attach-btn { width: 40px; height: 44px; flex: none; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  #attach-btn:hover { background: #1f2b32; }
  #attach-btn[aria-expanded="true"] { color: var(--accent); }
  #attach-menu { position: fixed; z-index: 25; min-width: 170px; padding: 6px; border-radius: 14px; background: #1c2830; border: 1px solid #2c3d45; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #attach-menu button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 11px 12px; border-radius: 9px; cursor: pointer; }
  #attach-menu button:hover, #attach-menu button:focus-visible { background: #26363f; }
  #tray { display: flex; gap: 8px; padding: 8px 12px; background: var(--bar); border-top: 1px solid #1d2a31; overflow-x: auto; }
  .titem { position: relative; flex: none; width: 68px; height: 68px; border-radius: 12px; overflow: hidden; background: #1f2b32; }
  .titem img, .titem video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tfile { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px; font-size: .68rem; color: var(--muted); text-align: center; }
  .tfile b { font-size: .95rem; color: var(--accent); }
  .tfile span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; display: grid; place-items: center; font-size: .8rem; line-height: 1; }
  .tprog { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); font-size: .8rem; font-weight: 700; }

  .bubble.has-att { position: relative; }
  .att { display: block; }
  .att img, .att video { display: block; width: min(260px, 64vw); height: auto; max-height: 340px; border-radius: 10px; background: #111b20; }
  .att img { object-fit: cover; cursor: zoom-in; }
  .att video { object-fit: contain; background: #000; aspect-ratio: 16 / 9; }
  .cap { display: block; margin-top: 5px; }
  .more { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.5); color: #fff; cursor: pointer; display: grid; place-items: center; line-height: 1; padding-bottom: 4px; }
  .filecard { display: flex; align-items: center; gap: 10px; min-width: 190px; max-width: 280px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.2); color: inherit; text-decoration: none; white-space: normal; }
  .filecard .ficon { flex: none; width: 38px; height: 44px; border-radius: 8px; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: .7rem; font-weight: 700; }
  .filecard .fname { display: block; font-size: .9rem; overflow-wrap: anywhere; }
  .filecard .fsize { display: block; font-size: .72rem; color: var(--muted); }

  #viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.93); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; }
  #viewer img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 6px; }
  #viewer a { color: var(--accent); font-size: .9rem; }
  #viewer-close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; }

  #cam { position: fixed; inset: 0; z-index: 45; background: #000; display: flex; flex-direction: column; }
  #cam-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #cam-preview.front { transform: scaleX(-1); }
  #cam-close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px; z-index: 2; }
  #cam-timer { position: absolute; top: calc(22px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 2; padding: 4px 12px; border-radius: 999px; background: rgba(217,83,79,.9); color: #fff; font-size: .85rem; display: none; }
  #cam.recording #cam-timer { display: block; }
  #cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 18px calc(24px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  #cam-modes { display: flex; gap: 6px; }
  .cmode { border: 0; border-radius: 999px; padding: 7px 16px; background: transparent; color: #cfd9db; cursor: pointer; }
  .cmode[aria-pressed="true"] { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
  #cam-row { width: 100%; max-width: 360px; display: flex; align-items: center; justify-content: space-between; }
  #cam-row .spacer { width: 58px; }
  #cam-shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; }
  #cam-shutter::after { content: ""; width: 54px; height: 54px; border-radius: 50%; background: #fff; transition: all .15s; }
  #cam.vmode #cam-shutter::after { background: #d9534f; }
  #cam.recording #cam-shutter::after { width: 28px; height: 28px; border-radius: 6px; background: #d9534f; }
  #cam.recording #cam-flip, #cam.recording #cam-modes { visibility: hidden; }

  /* Video call */
  header .icon-btn { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; }
  #call { position: fixed; inset: 0; z-index: 40; background: #05090b; display: flex; flex-direction: column; color: #e6eef0; }
  #remote-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #05090b; }
  @media (max-width: 720px) { #remote-video { object-fit: cover; } }
  #local-video {
    position: absolute; right: 14px; top: calc(14px + env(safe-area-inset-top, 0px)); z-index: 2;
    width: 28vw; min-width: 96px; max-width: 150px; aspect-ratio: 3 / 4; object-fit: cover;
    border-radius: 14px; background: #111b20; border: 1px solid #2c3d45; transform: scaleX(-1);
  }
  #local-video.back { transform: none; }
  #call.is-ringing #remote-video, #call.is-ringing #local-video { display: none; }
  #call-info { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 2px; padding: calc(18px + env(safe-area-inset-top, 0px)) 120px 18px 18px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #call-info strong { font-size: 1.1rem; }
  #call-info span { color: #c3cfd3; font-size: .9rem; }
  #call.is-ringing #call-info { margin: auto; align-items: center; text-align: center; padding: 18px; }
  #call.is-ringing #call-info strong { font-size: 1.5rem; }
  #call-controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; justify-content: center; gap: 16px;
    padding: 28px 18px calc(22px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, rgba(0,0,0,.6));
  }
  #call-incoming { position: relative; z-index: 3; display: flex; justify-content: center; gap: 56px; padding: 0 18px calc(60px + env(safe-area-inset-bottom, 0px)); }
  .cwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: .85rem; color: #c3cfd3; }
  .cbtn { width: 58px; height: 58px; flex: none; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(36,50,58,.92); color: #e6eef0; cursor: pointer; }
  .cbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cbtn[aria-pressed="true"] { background: #e6eef0; color: #0e1418; }
  .cbtn.hang, .cbtn.reject { background: #d9534f; color: #fff; }
  .cbtn.accept { background: #3fa66b; color: #fff; }
  .cbtn .slash { display: none; }
  .cbtn[aria-pressed="true"] .slash { display: block; }

  /* Emoji */
  #emoji-btn { width: 40px; height: 44px; flex: none; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  #emoji-btn:hover { background: #1f2b32; }
  #emoji-btn[aria-expanded="true"] { color: var(--accent); }
  #emoji-panel { background: var(--bar); border-top: 1px solid #1d2a31; }
  #emoji-tabs { display: flex; gap: 2px; padding: 6px 8px 0; overflow-x: auto; }
  .etab { flex: none; border: 0; background: transparent; font-size: 1.2rem; padding: 6px 10px; border-radius: 10px; cursor: pointer; opacity: .55; }
  .etab[aria-selected="true"] { opacity: 1; background: #26363f; }
  #emoji-grid { height: 210px; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 2px; align-content: start; }
  #emoji-grid button { border: 0; background: transparent; font-size: 1.5rem; line-height: 1; padding: 7px 0; border-radius: 10px; cursor: pointer; }
  #emoji-grid button:hover { background: #26363f; }

  #status { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #5a2a26; color: #ffd9d4; padding: 8px 14px; border-radius: 10px; font-size: .85rem; z-index: 30; }
  @media (prefers-reduced-motion: no-preference) {
    .bubble { animation: pop .14s ease-out; }
    @keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: none; opacity: 1; } }
  }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; background: rgba(143,208,204,.22); } }
</style>
</head>
<body>

<section id="login-screen">
  <img src="icon.svg" alt="">
  <h1>jb80-afk</h1>
  <p>Masuk dengan akun Google yang sudah didaftarkan.</p>
  <button class="btn" id="login">Masuk dengan Google</button>
  <div id="login-error" role="alert"></div>
</section>

<section id="app" hidden>
  <header>
    <div class="avatar" id="my-initial">?</div>
    <div class="title">
      <strong>jb80-afk</strong>
      <span id="my-email"></span>
    </div>
    <button id="call-btn" class="icon-btn" type="button" aria-label="Mulai video call" title="Video call">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h8A2.5 2.5 0 0 1 16 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 16.5z"/><path d="M16 10.5l5-3v9l-5-3z"/></svg>
    </button>
    <button id="logout">Keluar</button>
  </header>
  <main id="chat" aria-live="polite"></main>
  <div id="modebar" hidden>
    <div class="mb-text"><strong id="mb-title"></strong><span id="mb-sub"></span></div>
    <button id="mb-close" type="button" aria-label="Batal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
    </button>
  </div>
  <div id="tray" hidden aria-label="Lampiran yang akan dikirim"></div>
  <div id="emoji-panel" hidden>
    <div id="emoji-tabs" role="tablist" aria-label="Kategori emoji"></div>
    <div id="emoji-grid"></div>
  </div>
  <form id="form" autocomplete="off">
    <button id="attach-btn" type="button" aria-label="Lampirkan foto, video, atau file" aria-expanded="false" aria-controls="attach-menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg>
    </button>
    <button id="emoji-btn" type="button" aria-label="Pilih emoji" aria-expanded="false" aria-controls="emoji-panel">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M8 14.2c1 1.6 2.4 2.3 4 2.3s3-.7 4-2.3"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/></svg>
    </button>
    <textarea id="msg" rows="1" placeholder="Tulis pesan" maxlength="2000" aria-label="Tulis pesan"></textarea>
    <button id="send" type="submit" aria-label="Kirim pesan">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
  </form>
</section>

<input id="pick-media" type="file" accept="image/*,video/*" multiple hidden>
<input id="pick-file" type="file" multiple hidden>
<div id="attach-menu" role="menu" hidden>
  <button id="am-media" type="button" role="menuitem">Foto atau video</button>
  <button id="am-camera" type="button" role="menuitem">Kamera</button>
  <button id="am-file" type="button" role="menuitem">File</button>
</div>

<div id="cam" hidden role="dialog" aria-label="Kamera">
  <video id="cam-preview" autoplay playsinline muted></video>
  <button id="cam-close" class="cbtn" type="button" aria-label="Tutup kamera">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <div id="cam-timer" aria-live="polite">00:00</div>
  <div id="cam-bottom">
    <div id="cam-modes">
      <button id="cam-mode-photo" class="cmode" type="button" aria-pressed="true">Foto</button>
      <button id="cam-mode-video" class="cmode" type="button" aria-pressed="false">Video</button>
    </div>
    <div id="cam-row">
      <span class="spacer"></span>
      <button id="cam-shutter" type="button" aria-label="Ambil foto"></button>
      <button id="cam-flip" class="cbtn" type="button" aria-label="Ganti kamera depan atau belakang">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.5-5.8L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.5 5.8L4 15.5M4 20v-4.5h4.5"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="viewer" hidden role="dialog" aria-label="Lihat foto">
  <button id="viewer-close" class="cbtn" type="button" aria-label="Tutup">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <img id="viewer-img" alt="">
  <a id="viewer-open" href="#" target="_blank" rel="noopener">Buka ukuran asli</a>
</div>

<div id="call" hidden role="dialog" aria-label="Video call">
  <video id="remote-video" autoplay playsinline></video>
  <video id="local-video" autoplay playsinline muted></video>
  <div id="call-info"><strong id="call-name"></strong><span id="call-status" aria-live="polite"></span></div>
  <div id="call-incoming" hidden>
    <div class="cwrap">
      <button class="cbtn reject" id="btn-reject" type="button" aria-label="Tolak panggilan">

    <button class="cbtn hang" id="btn-hang" type="button" aria-label="Akhiri panggilan">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.5 15.5c5-5 12-5 17 0l-2.2 2.6a1.5 1.5 0 0 1-1.9.3l-2.6-1.4a1.5 1.5 0 0 1-.8-1.4v-1.6a11 11 0 0 0-3 0v1.6a1.5 1.5 0 0 1-.8 1.4l-2.6 1.4a1.5 1.5 0 0 1-1.9-.3z"/></svg>

<div id="menu" role="menu" hidden></div>
<div id="status" hidden role="alert"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject }
  from "https://www.gstatic.com/firebasejs/10.14.0/firebase-storage.js";

/* 1) GANTI dengan firebaseConfig dari Firebase Console (Project settings > Your apps) */
const firebaseConfig = {
  apiKey: "AIzaSyBtPMTeugGfGTWKBwG1TLWxV_kf0aD6304",
  authDomain: "pc-afk.firebaseapp.com",
  projectId: "pc-afk",
  // storageBucket: "ISI_DI_SINI.firebasestorage.app",   // hanya perlu kalau fitur lampiran diaktifkan (butuh paket Blaze)
  appId: "1:503745421974:web:e743ae1217d9b1cce9d8b7"
};

/* 2) Hanya dua email ini yang boleh masuk. Pengaman utama tetap firestore.rules */
const ALLOWED = ["jamesboni80@gmail.com", "lidyaaveronica@gmail.com"];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
/* Fitur kirim foto/video/file butuh Firebase Storage (paket Blaze). Ubah ke true hanya kalau sudah dipasang. */
const ENABLE_ATTACHMENTS = false;
const storage = ENABLE_ATTACHMENTS ? getStorage(app) : null;

const $ = id => document.getElementById(id);
let unsubscribe = null;

$("login").onclick = async () => {
  $("login-error").textContent = "";
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (err) {
    if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") {
      $("login-error").textContent = "Gagal masuk. Coba lagi. (" + (err.code || "error") + ")";
    }
  }
};
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }

  if (!user) {
    $("app").hidden = true;
    $("login-screen").hidden = false;
    return;
  }

  const email = (user.email || "").toLowerCase();
  if (!user.emailVerified || !ALLOWED.includes(email)) {
    await signOut(auth);
    $("login-error").textContent = "Akses ditolak. Email " + email + " tidak terdaftar.";
    return;
  }

  $("login-screen").hidden = true;
  $("app").hidden = false;
  $("my-email").textContent = email;
  $("my-initial").textContent = (user.displayName || email)[0].toUpperCase();
  startChat(user);
});

function startChat(user) {
  const box = $("chat");
  const input = $("msg");
  const menu = $("menu");
  let byId = new Map();
  let lastId = null;
  let replyTo = null;   // pesan yang sedang dibalas
  let editing = null;   // pesan yang sedang diedit

  /* ---------- Mode balas / edit ---------- */
  function showBar(title, sub) {
    $("mb-title").textContent = title;
    $("mb-sub").textContent = sub;
    $("modebar").hidden = false;
  }
  function clearMode() {
    replyTo = null; editing = null;
    $("modebar").hidden = true;
  }
  function startReply(m) {
    clearMode();
    replyTo = { id: m.id, name: m.name || "Teman", text: (m.text || attachLabel(m.attachment || {})).slice(0, 100) };
    showBar("Membalas " + replyTo.name, replyTo.text);
    input.focus();
  }
  function startEdit(m) {
    clearMode();
    editing = m;
    showBar("Edit pesan", m.text);
    input.value = m.text;
    autosize();
    input.focus();
  }
  $("mb-close").onclick = () => {
    const wasEditing = !!editing;
    clearMode();
    if (wasEditing) { input.value = ""; autosize(); }
  };

  async function removeMessage(m) {
    if (!confirm("Hapus pesan ini untuk semua orang?")) return;
    try {
      await updateDoc(doc(db, "messages", m.id), { text: "", deleted: true });
      if (m.attachment && m.attachment.path) deleteObject(ref(storage, m.attachment.path)).catch(() => {});
      if (editing && editing.id === m.id) { clearMode(); input.value = ""; autosize(); }
    } catch (err) {
      showStatus("Pesan gagal dihapus. Coba lagi.");
    }
  }

  /* ---------- Menu aksi ---------- */
  function closeMenu() { menu.hidden = true; menu.replaceChildren(); }
  function openMenu(bubble, m, mine) {
    menu.replaceChildren();
    const add = (label, fn, cls) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "menuitem");
      b.textContent = label;
      if (cls) b.className = cls;
      b.onclick = () => { closeMenu(); fn(); };
      menu.appendChild(b);
    };
    add("Balas", () => startReply(m));
    if (mine) {
      add(m.attachment ? "Edit keterangan" : "Edit", () => startEdit(m));
      add("Hapus", () => removeMessage(m), "danger");
    }
    menu.hidden = false;
    const r = bubble.getBoundingClientRect();
    const mw = menu.offsetWidth, mh = menu.offsetHeight;
    let left = Math.min(Math.max(8, r.left), window.innerWidth - mw - 8);
    let top = r.bottom + 6;
    if (top + mh > window.innerHeight - 90) top = Math.max(8, r.top - mh - 6);
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    menu.firstChild.focus();
  }
  document.addEventListener("click", e => { if (!menu.contains(e.target)) closeMenu(); }, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
  box.addEventListener("scroll", closeMenu);
  box.addEventListener("wheel", () => { box.dataset.stick = "0"; }, { passive: true });
  box.addEventListener("touchmove", () => { box.dataset.stick = "0"; }, { passive: true });

  function jumpTo(id) {
    const el = document.getElementById("m-" + id);
    if (!el) { showStatus("Pesan asli tidak ditemukan."); return; }
    el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }

  /* ---------- Tampilan pesan ---------- */
  function renderMessage(m) {
    const mine = m.uid === user.uid;
    const date = m.createdAt ? m.createdAt.toDate() : new Date();

    const row = document.createElement("div");
    row.className = "row " + (mine ? "mine" : "theirs");
    row.id = "m-" + m.id;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (!mine) {
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = m.name || "Teman";
      bubble.appendChild(who);
    }

    if (m.replyTo && !m.deleted) {
      const orig = byId.get(m.replyTo.id);
      const q = document.createElement("span");
      q.className = "quote";
      const qn = document.createElement("b");
      qn.textContent = m.replyTo.name;
      const qt = document.createElement("span");
      if (orig && orig.deleted) { qt.textContent = "Pesan telah dihapus"; qt.className = "gone"; }
      else qt.textContent = m.replyTo.text;
      q.append(qn, qt);
      q.onclick = e => { e.stopPropagation(); jumpTo(m.replyTo.id); };
      bubble.appendChild(q);
    }

    if (m.deleted) {
      bubble.classList.add("is-deleted");
      const s = document.createElement("span");
      s.className = "deleted";
      s.textContent = "Pesan ini telah dihapus";
      bubble.appendChild(s);
    } else {
      if (m.attachment) {
        bubble.classList.add("has-att");
        bubble.appendChild(renderAttachment(m.attachment));
        if (m.attachment.type !== "file") {
          const more = document.createElement("button");
          more.type = "button"; more.className = "more"; more.textContent = "\u22EF";
          more.setAttribute("aria-label", "Pilihan pesan");
          more.onclick = e => { e.stopPropagation(); openMenu(bubble, m, mine); };
          bubble.appendChild(more);
        }
      }
      if (m.text) {
        if (m.attachment) {
          const cap = document.createElement("span");
          cap.className = "cap";
          cap.appendChild(document.createTextNode(m.text));
          bubble.appendChild(cap);
        } else {
          bubble.appendChild(document.createTextNode(m.text));   // aman: bukan innerHTML
        }
      }
      bubble.tabIndex = 0;
      bubble.setAttribute("role", "button");
      bubble.setAttribute("aria-label", "Pilihan pesan");
      bubble.onclick = () => openMenu(bubble, m, mine);
      bubble.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openMenu(bubble, m, mine); } };
    }

    const t = document.createElement("span");
    t.className = "time";
    const hhmm = date.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    t.textContent = (m.edited && !m.deleted ? "diedit " : "") + hhmm;
    bubble.appendChild(t);

    row.appendChild(bubble);
    return row;
  }

  const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(200));
  const unsubMsgs = onSnapshot(q, snap => {
    closeMenu();
    const prevTop = box.scrollTop;
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
    const msgs = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) })).reverse();
    byId = new Map(msgs.map(m => [m.id, m]));
    box.replaceChildren();

    if (!msgs.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Belum ada pesan. Kirim pesan pertama.";
      box.appendChild(e);
      return;
    }

    let lastDay = "";
    for (const m of msgs) {
      const date = m.createdAt ? m.createdAt.toDate() : new Date();
      const day = date.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      if (day !== lastDay) {
        const d = document.createElement("div");
        d.className = "day";
        d.textContent = day;
        box.appendChild(d);
        lastDay = day;
      }
      box.appendChild(renderMessage(m));
    }

    // Scroll ke bawah hanya saat ada pesan baru (atau pertama kali buka). Edit/hapus tidak menggeser layar.
    const last = msgs[msgs.length - 1];
    const first = lastId === null;
    const isNew = last.id !== lastId;
    lastId = last.id;
    const stick = first || (isNew && (nearBottom || last.uid === user.uid));
    if (stick) box.scrollTop = box.scrollHeight;
    else box.scrollTop = prevTop;
    box.dataset.stick = stick ? "1" : "0";
    if (stick) setTimeout(() => { box.dataset.stick = "0"; }, 3000);

    // Kalau pesan yang sedang diedit/dibalas sudah dihapus, batalkan modenya
    if (editing && (!byId.get(editing.id) || byId.get(editing.id).deleted)) { clearMode(); input.value = ""; autosize(); }
    if (replyTo && byId.get(replyTo.id) && byId.get(replyTo.id).deleted) clearMode();
  }, () => showStatus("Tidak bisa memuat pesan. Pastikan Firestore Rules sudah dipublish."));

  const stopCalls = setupCalls(user);
  unsubscribe = () => { unsubMsgs(); stopCalls(); };

  /* ---------- Kotak tulis ---------- */
  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    // Enter = kirim (desktop), Shift+Enter = baris baru
    if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover: hover)").matches) {
      e.preventDefault();
      $("form").requestSubmit();
    }
  });

  /* ---------- Emoji ---------- */
  const BASE_CATS = [
    { icon: "😀", name: "Wajah", list: "😀 😃 😄 😁 😆 😅 😂 🤣 🥲 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😜 🤪 😝 🤑 🤗 🤭 🤫 🤔 🤐 🤨 😐 😑 😶 😏 😒 🙄 😬 😮‍💨 🤥 😔 😪 🤤 😴 😷 🤒 🤕 🤢 🤮 🥵 🥶 🥴 😵 🤯 🤠 🥳 😎 🤓 🧐 😕 😟 🙁 😮 😯 😲 😳 🥺 😦 😧 😨 😰 😥 😢 😭 😱 😖 😣 😞 😓 😩 😫 🥱 😤 😡 😠 🤬 😈 👿 💀 💩 🤡 👻 👽 🤖" },
    { icon: "👍", name: "Gestur", list: "👍 👎 👌 🤌 🤏 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤝 🙏 👏 🙌 👐 🤲 💪 🙋 🙆 🙅 🤷 🤦 🙇 💁 🫡 🫶 🫰 ✍️ 💅 🤳 👀 👂 👃 👄 🧠" },
    { icon: "❤️", name: "Hati dan simbol", list: "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💯 💢 💥 💫 💦 💨 🔥 ✨ ⭐ 🌟 ⚡ 🎉 🎊 ✅ ❌ ❗ ❓ ⚠️ 💤 💬 💭 🔔 🔒 ➕ ➖ ✔️" },
    { icon: "🍔", name: "Makanan", list: "🍎 🍌 🍉 🍇 🍓 🍒 🍑 🥭 🍍 🥥 🥑 🍅 🌶️ 🥕 🌽 🥔 🍞 🧀 🍳 🥞 🥓 🍔 🍟 🍕 🌭 🥪 🌮 🌯 🍜 🍝 🍣 🍤 🍙 🍚 🍛 🍢 🍡 🍦 🍩 🍪 🎂 🍰 🍫 🍬 🍿 ☕ 🍵 🥤 🧋 🍺 🍷 🥂" },
    { icon: "🐶", name: "Hewan dan alam", list: "🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐔 🐧 🐦 🦆 🦉 🐴 🦄 🐝 🦋 🐢 🐍 🐙 🐠 🐬 🐳 🌸 🌹 🌻 🌷 🌲 🌴 🌵 🍀 🍁 🌈 ☀️ 🌙 ⛅ 🌧️ ❄️ 🌊" },
    { icon: "⚽", name: "Aktivitas dan benda", list: "⚽ 🏀 🏈 ⚾ 🎾 🏸 🏓 🎱 🎮 🎯 🎲 🎵 🎶 🎤 🎧 🎸 📱 💻 📷 📞 💡 📚 ✏️ 📌 📎 🔑 🎁 🏆 🚗 🚕 🏍️ ✈️ 🚀 🏠 🏖️ ⏰ 💰 💳 🛒" }
  ].map(c => ({ ...c, list: c.list.split(" ") }));

  const panel = $("emoji-panel");
  let curCat = "Wajah";

  const loadRecent = () => { try { return JSON.parse(localStorage.getItem("emoji-recent") || "[]"); } catch { return []; } };
  const saveRecent = e => {
    try { localStorage.setItem("emoji-recent", JSON.stringify([e, ...loadRecent().filter(x => x !== e)].slice(0, 24))); } catch {}
  };
  const allCats = () => {
    const r = loadRecent();
    return r.length ? [{ icon: "🕘", name: "Terakhir dipakai", list: r }, ...BASE_CATS] : BASE_CATS;
  };
  const keepFocus = e => e.preventDefault();   // supaya kotak tulis tidak kehilangan fokus (keyboard HP tidak berkedip)

  function renderTabs() {
    const tabs = $("emoji-tabs");
    tabs.replaceChildren();
    for (const c of allCats()) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "etab"; b.textContent = c.icon;
      b.setAttribute("role", "tab"); b.setAttribute("aria-label", c.name);
      b.setAttribute("aria-selected", String(c.name === curCat));
      b.onmousedown = keepFocus;
      b.onclick = () => { curCat = c.name; renderTabs(); renderGrid(); };
      tabs.appendChild(b);
    }
  }
  function renderGrid() {
    const grid = $("emoji-grid");
    grid.replaceChildren();
    const cat = allCats().find(c => c.name === curCat) || BASE_CATS[0];
    grid.scrollTop = 0;
    for (const em of cat.list) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = em; b.setAttribute("aria-label", em);
      b.onmousedown = keepFocus;
      b.onclick = () => insertEmoji(em);
      grid.appendChild(b);
    }
  }
  function insertEmoji(em) {
    if (input.value.length + em.length > input.maxLength) { showStatus("Pesan sudah mencapai batas 2000 karakter."); return; }
    const start = input.selectionStart ?? input.value.length;
    const end = input.selectionEnd ?? start;
    input.setRangeText(em, start, end, "end");
    autosize();
    saveRecent(em);
    renderTabs();
  }
  function toggleEmoji(open) {
    panel.hidden = !open;
    $("emoji-btn").setAttribute("aria-expanded", String(open));
    if (open) { renderTabs(); renderGrid(); }
  }
  $("emoji-btn").onmousedown = keepFocus;
  $("emoji-btn").onclick = () => toggleEmoji(panel.hidden);
  panel.addEventListener("keydown", e => { if (e.key === "Escape") { toggleEmoji(false); input.focus(); } });
  input.addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden) toggleEmoji(false); });

  /* ---------- Lampiran (foto, video, file) ---------- */
  let pending = [];      // { file, kind, w, h, url, progress, progEl }
  let uploading = false;
  const tray = $("tray");
  const amenu = $("attach-menu");

  function updateProgress() {
    pending.forEach(p => {
      if (!p.progEl) return;
      p.progEl.hidden = p.progress < 0;
      p.progEl.textContent = p.progress >= 0 ? p.progress + "%" : "";
    });
  }
  function renderTray() {
    tray.replaceChildren();
    tray.hidden = pending.length === 0;
    pending.forEach((p, idx) => {
      const item = document.createElement("div");
      item.className = "titem";
      let th;
      if (p.kind === "image") { th = document.createElement("img"); th.src = p.url; th.alt = ""; }
      else if (p.kind === "video") {
        th = document.createElement("video");
        th.src = p.url + "#t=0.1"; th.muted = true; th.preload = "metadata"; th.playsInline = true;
      } else {
        th = document.createElement("div");
        th.className = "tfile";
        const ext = document.createElement("b");
        ext.textContent = (p.file.name.includes(".") ? p.file.name.split(".").pop() : "FILE").slice(0, 4).toUpperCase();
        const nm = document.createElement("span");
        nm.textContent = p.file.name;
        th.append(ext, nm);
      }
      item.appendChild(th);
      const x = document.createElement("button");
      x.type = "button"; x.className = "tx"; x.textContent = "\u00D7";
      x.setAttribute("aria-label", "Hapus lampiran " + p.file.name);
      x.onclick = () => {
        if (uploading) return;
        URL.revokeObjectURL(p.url);
        pending.splice(idx, 1);
        renderTray();
      };
      item.appendChild(x);
      const pr = document.createElement("div");
      pr.className = "tprog"; pr.hidden = true;
      p.progEl = pr;
      item.appendChild(pr);
      tray.appendChild(item);
    });
    updateProgress();
  }

  async function addFiles(list) {
    for (const f of Array.from(list)) {
      if (f.size > MAX_BYTES) { showStatus(f.name + " terlalu besar (maksimal 50 MB)."); continue; }
      if (pending.length >= 10) { showStatus("Maksimal 10 lampiran sekali kirim."); break; }
      let kind = kindOf(f), file = f, w = 0, h = 0;
      if (kind === "image") ({ file, w, h } = await prepareImage(f));
      else if (kind === "video") { const m = await readVideoMeta(f); w = m.w; h = m.h; }
      pending.push({ file, kind, w, h, url: URL.createObjectURL(file), progress: -1, progEl: null });
      renderTray();
    }
  }

  function closeAttach() { amenu.hidden = true; $("attach-btn").setAttribute("aria-expanded", "false"); }
  $("attach-btn").hidden = !ENABLE_ATTACHMENTS;
  $("attach-btn").onmousedown = keepFocus;
  $("attach-btn").onclick = () => {
    if (!amenu.hidden) { closeAttach(); return; }
    const r = $("form").getBoundingClientRect();
    amenu.style.left = Math.max(8, r.left + 10) + "px";
    amenu.style.bottom = (window.innerHeight - r.top + 8) + "px";
    amenu.hidden = false;
    $("attach-btn").setAttribute("aria-expanded", "true");
  };
  document.addEventListener("click", e => {
    if (!amenu.contains(e.target) && !e.target.closest("#attach-btn")) closeAttach();
  }, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeAttach(); });

  $("am-media").onclick = () => { closeAttach(); $("pick-media").click(); };
  $("am-file").onclick = () => { closeAttach(); $("pick-file").click(); };
  $("am-camera").onclick = () => { closeAttach(); openCamera(f => addFiles([f])); };
  $("pick-media").onchange = e => { const fl = Array.from(e.target.files); e.target.value = ""; addFiles(fl); };
  $("pick-file").onchange = e => { const fl = Array.from(e.target.files); e.target.value = ""; addFiles(fl); };

  function uploadFile(p) {
    return new Promise((resolve, reject) => {
      const safe = p.file.name.replace(/[^\w.\- ]+/g, "_").slice(-80);
      const path = "chat/" + user.uid + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-" + safe;
      const task = uploadBytesResumable(ref(storage, path), p.file, { contentType: p.file.type || "application/octet-stream" });
      p.progress = 0; updateProgress();
      task.on("state_changed",
        s => { p.progress = Math.round(100 * s.bytesTransferred / s.totalBytes); updateProgress(); },
        err => { p.progress = -1; updateProgress(); reject(err); },
        async () => {
          try {
            const url = await getDownloadURL(task.snapshot.ref);
            const att = { type: p.kind, url, path, name: p.file.name.slice(0, 200), size: p.file.size, mime: p.file.type || "" };
            if (p.w && p.h) { att.w = p.w; att.h = p.h; }
            resolve(att);
          } catch (err) { reject(err); }
        });
    });
  }

  /* ---------- Kirim / simpan edit ---------- */
  $("form").onsubmit = async e => {
    e.preventDefault();
    if (uploading) return;
    const text = input.value.trim();

    if (editing) {
      if (!text && !editing.attachment) { showStatus("Pesan tidak boleh kosong. Pakai Hapus kalau mau menghapus."); return; }
      $("send").disabled = true;
      try {
        if (text !== editing.text) await updateDoc(doc(db, "messages", editing.id), { text, edited: true });
        clearMode(); input.value = ""; autosize();
      } catch (err) {
        showStatus("Pesan gagal diubah. Coba lagi.");
      } finally {
        $("send").disabled = false; input.focus();
      }
      return;
    }

    if (!text && !pending.length) return;
    $("send").disabled = true;
    uploading = true;
    try {
      if (!pending.length) {
        const data = { uid: user.uid, name: user.displayName || user.email, text, createdAt: serverTimestamp() };
        if (replyTo) data.replyTo = replyTo;
        await addDoc(collection(db, "messages"), data);
        notifyByEmail(user, text, null, 0);
        clearMode(); input.value = ""; autosize();
      } else {
        let first = true;
        const total = pending.length;
        while (pending.length) {
          const p = pending[0];
          const att = await uploadFile(p);
          const data = { uid: user.uid, name: user.displayName || user.email, text: first ? text : "", createdAt: serverTimestamp(), attachment: att };
          if (first && replyTo) data.replyTo = replyTo;
          await addDoc(collection(db, "messages"), data);
          URL.revokeObjectURL(p.url);
          pending.shift();
          renderTray();
          if (first) { notifyByEmail(user, text, att, total); clearMode(); input.value = ""; autosize(); first = false; }
        }
      }
    } catch (err) {
      showStatus("Gagal mengirim. Pastikan Storage sudah aktif dan Rules sudah dipublish.");
      renderTray();
    } finally {
      uploading = false;
      $("send").disabled = false;
      input.focus();
    }
  };
}

/* ================= LAMPIRAN: fungsi bantu ================= */
const MAX_BYTES = 50 * 1024 * 1024;
const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB";
const kindOf = f => /^image\/(jpeg|png|webp|gif|avif|bmp)$/.test(f.type) ? "image" : (f.type || "").startsWith("video/") ? "video" : "file";
const attachLabel = a => a.type === "image" ? "Foto" : a.type === "video" ? "Video" : (a.name || "File");
const stamp = () => new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);

// Perkecil foto (maks 1600 px) supaya hemat kuota dan cepat terkirim
async function prepareImage(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const w = bmp.width, h = bmp.height;
    const canShrink = /^image\/(jpeg|png|webp)$/.test(file.type);
    const scale = Math.min(1, 1600 / Math.max(w, h));
    if (!canShrink || (scale === 1 && (file.type === "image/png" || file.size < 600 * 1024))) { bmp.close(); return { file, w, h }; }
    const cw = Math.round(w * scale), ch = Math.round(h * scale);
    const c = document.createElement("canvas");
    c.width = cw; c.height = ch;
    c.getContext("2d").drawImage(bmp, 0, 0, cw, ch);
    bmp.close();
    const type = file.type === "image/png" ? "image/png" : "image/jpeg";
    const blob = await new Promise(r => c.toBlob(r, type, 0.82));
    if (!blob || (scale === 1 && blob.size >= file.size)) return { file, w, h };
    const name = file.name.replace(/\.[^.]+$/, "") + (type === "image/png" ? ".png" : ".jpg");
    return { file: new File([blob], name, { type }), w: cw, h: ch };
  } catch (err) {
    return { file, w: 0, h: 0 };
  }
}

function readVideoMeta(file) {
  return new Promise(res => {
    const v = document.createElement("video");
    const u = URL.createObjectURL(file);
    let done = false;
    const finish = r => { if (done) return; done = true; URL.revokeObjectURL(u); res(r); };
    v.preload = "metadata"; v.muted = true;
    v.onloadedmetadata = () => finish({ w: v.videoWidth || 0, h: v.videoHeight || 0 });
    v.onerror = () => finish({ w: 0, h: 0 });
    setTimeout(() => finish({ w: 0, h: 0 }), 4000);
    v.src = u;
  });
}

function renderAttachment(a) {
  const wrap = document.createElement("div");
  wrap.className = "att";
  if (a.type === "image") {
    const img = document.createElement("img");
    img.src = a.url; img.alt = a.name || "Foto"; img.loading = "lazy"; img.decoding = "async";
    if (a.w && a.h) { img.width = a.w; img.height = a.h; }
    img.onload = () => { const b = $("chat"); if (b.dataset.stick === "1") b.scrollTop = b.scrollHeight; };
    img.onclick = e => { e.stopPropagation(); openViewer(a); };
    wrap.appendChild(img);
  } else if (a.type === "video") {
    const v = document.createElement("video");
    v.src = a.url; v.controls = true; v.preload = "metadata"; v.playsInline = true;
    if (a.w && a.h) v.style.aspectRatio = a.w + " / " + a.h;
    v.onclick = e => e.stopPropagation();
    wrap.appendChild(v);
  } else {
    const link = document.createElement("a");
    link.className = "filecard"; link.href = a.url; link.target = "_blank"; link.rel = "noopener"; link.download = a.name || "";
    link.onclick = e => e.stopPropagation();
    const ic = document.createElement("span");
    ic.className = "ficon";
    ic.textContent = ((a.name || "").includes(".") ? a.name.split(".").pop() : "FILE").slice(0, 4).toUpperCase();
    const info = document.createElement("span");
    const nm = document.createElement("span"); nm.className = "fname"; nm.textContent = a.name || "File";
    const sz = document.createElement("span"); sz.className = "fsize"; sz.textContent = fmtSize(a.size || 0) + " - ketuk untuk membuka";
    info.append(nm, sz);
    link.append(ic, info);
    wrap.appendChild(link);
  }
  return wrap;
}

function openViewer(a) {
  $("viewer-img").src = a.url;
  $("viewer-img").alt = a.name || "";
  $("viewer-open").href = a.url;
  $("viewer").hidden = false;
  $("viewer-close").focus();
}
function closeViewer() { $("viewer").hidden = true; $("viewer-img").removeAttribute("src"); }
$("viewer-close").onclick = closeViewer;
$("viewer").onclick = e => { if (e.target.id === "viewer") closeViewer(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("viewer").hidden) closeViewer(); });

// Kamera langsung (foto dan rekam video) di dalam aplikasi
function openCamera(onFile) {
  if (!$("call").hidden) { showStatus("Tutup video call dulu untuk memakai kamera."); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showStatus("Kamera tidak tersedia di browser ini."); return; }
  const cam = $("cam"), vid = $("cam-preview");
  let stream = null, front = true, mode = "photo", rec = null, chunks = [], t0 = 0, tick = null;

  async function startStream() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: front ? "user" : "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    vid.srcObject = stream;
    vid.classList.toggle("front", front);
  }
  function close() {
    clearInterval(tick);
    if (rec && rec.state !== "inactive") { rec.onstop = null; rec.stop(); }
    rec = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    vid.srcObject = null;
    cam.classList.remove("recording", "vmode");
    cam.hidden = true;
  }
  function setMode(m) {
    if (rec) return;
    mode = m;
    $("cam-mode-photo").setAttribute("aria-pressed", String(m === "photo"));
    $("cam-mode-video").setAttribute("aria-pressed", String(m === "video"));
    cam.classList.toggle("vmode", m === "video");
    $("cam-shutter").setAttribute("aria-label", m === "photo" ? "Ambil foto" : "Mulai rekam");
  }
  async function startRec() {
    if (typeof MediaRecorder === "undefined") { showStatus("Perekaman video tidak didukung browser ini."); return; }
    try {
      if (!stream.getAudioTracks().length) {
        const a = await navigator.mediaDevices.getUserMedia({ audio: true });
        stream.addTrack(a.getAudioTracks()[0]);
      }
    } catch (err) { showStatus("Mikrofon tidak bisa dipakai, video direkam tanpa suara."); }
    const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"].find(m => MediaRecorder.isTypeSupported(m)) || "";
    chunks = [];
    const r = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 2500000 } : undefined);
    rec = r;
    r.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    r.onstop = () => {
      const type = (r.mimeType || mime || "video/webm").split(";")[0];
      const file = new File([new Blob(chunks, { type })], "video-" + stamp() + "." + (type.includes("mp4") ? "mp4" : "webm"), { type });
      close();
      onFile(file);
    };
    r.start(1000);
    t0 = Date.now();
    $("cam-timer").textContent = "00:00";
    cam.classList.add("recording");
    $("cam-shutter").setAttribute("aria-label", "Berhenti rekam");
    tick = setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);
      $("cam-timer").textContent = String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
      if (sec >= 120) r.stop();   // batas 2 menit
    }, 500);
  }

  $("cam-close").onclick = close;
  $("cam-mode-photo").onclick = () => setMode("photo");
  $("cam-mode-video").onclick = () => setMode("video");
  $("cam-flip").onclick = async () => {
    if (rec) return;
    front = !front;
    try { await startStream(); } catch (err) { front = !front; showStatus("Tidak bisa mengganti kamera."); }
  };
  $("cam-shutter").onclick = () => {
    if (!stream) return;
    if (mode === "photo") {
      const w = vid.videoWidth, h = vid.videoHeight;
      if (!w || !h) return;
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(vid, 0, 0, w, h);
      c.toBlob(b => {
        if (!b) return;
        const file = new File([b], "foto-" + stamp() + ".jpg", { type: "image/jpeg" });
        close();
        onFile(file);
      }, "image/jpeg", 0.9);
    } else if (!rec) startRec();
    else rec.stop();
  };

  setMode("photo");
  cam.hidden = false;
  startStream().catch(err => {
    close();
    showStatus(err && err.name === "NotAllowedError" ? "Izin kamera ditolak. Izinkan lewat pengaturan browser." : "Kamera tidak bisa dipakai.");
  });
}

/* ================= VIDEO CALL (WebRTC, sinyal lewat Firestore) ================= */
const ICE_SERVERS = [
  { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }
  /* Kalau video call gagal tersambung di jaringan tertentu, tambahkan server TURN di sini, contoh:
  , { urls: "turn:alamat-server-turn:443", username: "USERNAME", credential: "PASSWORD" } */
];

function setupCalls(user) {
  const overlay = $("call"), remoteV = $("remote-video"), localV = $("local-video");
  const origTitle = document.title;
  const FINAL = ["rejected", "ended", "missed"];
  const plain = o => JSON.parse(JSON.stringify(o));
  const pad = n => String(n).padStart(2, "0");

  let pc = null, localStream = null, callRef = null, role = null, callId = null;
  let incoming = null, answerApplied = false, frontCam = true, connectedAt = 0;
  let unsubs = [], pendingIn = [], pendingOut = [];
  let ringTimer = null, clockTimer = null;
  const handled = new Set();

  const setStatus = t => { $("call-status").textContent = t; };
  function showOverlay({ name, status, ringing }) {
    $("call-name").textContent = name;
    setStatus(status);
    $("call-incoming").hidden = !ringing;
    $("call-controls").hidden = !!ringing;
    overlay.classList.toggle("is-ringing", !!ringing);
    overlay.hidden = false;
  }

  async function getMedia() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("no-media");
    return navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
    });
  }
  function mediaError(err) {
    const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
    showStatus(denied ? "Izin kamera dan mikrofon ditolak. Izinkan lewat pengaturan browser." : "Kamera atau mikrofon tidak bisa dipakai.");
  }

  function sendCandidate(c) {
    if (!callRef) { pendingOut.push(c); return; }
    addDoc(collection(callRef, "candidates"), { uid: user.uid, candidate: c }).catch(() => {});
  }
  function flushOut() { const q = pendingOut; pendingOut = []; q.forEach(sendCandidate); }
  function flushIn() { const q = pendingIn; pendingIn = []; q.forEach(c => pc && pc.addIceCandidate(c).catch(() => {})); }

  function onConnected() {
    clearTimeout(ringTimer);
    connectedAt = Date.now();
    setStatus("00:00");
    clearInterval(clockTimer);
    clockTimer = setInterval(() => {
      const sec = Math.floor((Date.now() - connectedAt) / 1000);
      setStatus(pad(Math.floor(sec / 60)) + ":" + pad(sec % 60));
    }, 1000);
  }

  function makePc() {
    const p = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    localStream.getTracks().forEach(t => p.addTrack(t, localStream));
    localV.srcObject = localStream;
    p.ontrack = e => { remoteV.srcObject = e.streams[0]; remoteV.play().catch(() => {}); };
    p.onicecandidate = e => { if (e.candidate) sendCandidate(plain(e.candidate.toJSON())); };
    p.onconnectionstatechange = () => {
      if (pc !== p) return;
      if (p.connectionState === "connected") onConnected();
      else if (p.connectionState === "disconnected") setStatus("Koneksi tidak stabil...");
      else if (p.connectionState === "failed") hangUp("Koneksi gagal tersambung. Coba lagi, atau pindah jaringan.");
    };
    return p;
  }

  function prepareCamButtons() {
    $("btn-flip").hidden = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    navigator.mediaDevices.enumerateDevices()
      .then(ds => { $("btn-flip").hidden = ds.filter(d => d.kind === "videoinput").length < 2; })
      .catch(() => {});
  }

  function watchCall() {
    unsubs.push(onSnapshot(callRef, async snap => {
      const d = snap.data();
      if (!d || !pc) return;
      if (role === "caller" && d.answer && !answerApplied) {
        answerApplied = true;
        try { await pc.setRemoteDescription(d.answer); flushIn(); } catch (err) { hangUp("Gagal menyambung. Coba lagi."); }
      }
      if (FINAL.includes(d.status)) {
        endLocal(d.status === "rejected" ? "Panggilan ditolak." : d.status === "missed" ? "Panggilan tidak dijawab." : "Panggilan selesai.");
      }
    }));
    unsubs.push(onSnapshot(collection(callRef, "candidates"), snap => {
      snap.docChanges().forEach(ch => {
        if (ch.type !== "added") return;
        const d = ch.doc.data();
        if (d.uid === user.uid) return;
        if (pc && pc.remoteDescription) pc.addIceCandidate(d.candidate).catch(() => {});
        else pendingIn.push(d.candidate);
      });
    }));
  }

  function endLocal(msg) {
    clearTimeout(ringTimer); clearInterval(clockTimer);
    unsubs.forEach(u => u()); unsubs = [];
    if (pc) { pc.onconnectionstatechange = null; pc.close(); }
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    pc = null; localStream = null; callRef = null; callId = null; role = null;
    answerApplied = false; frontCam = true; pendingIn = []; pendingOut = [];
    remoteV.srcObject = null; localV.srcObject = null;
    localV.classList.remove("back"); localV.style.visibility = "visible";
    $("btn-mic").setAttribute("aria-pressed", "false");
    $("btn-cam").setAttribute("aria-pressed", "false");
    if (!incoming) overlay.hidden = true;
    if (msg) showStatus(msg);
  }
  function hangUp(msg, status) {
    if (callRef) updateDoc(callRef, { status: status || "ended" }).catch(() => {});
    endLocal(msg);
  }

  /* ----- Memulai panggilan ----- */
  async function startCall() {
    if (pc || incoming) return;
    try { localStream = await getMedia(); } catch (err) { mediaError(err); return; }
    role = "caller";
    showOverlay({ name: "Video call", status: "Memanggil..." });
    pc = makePc();
    prepareCamButtons();
    let ref;
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ref = await addDoc(collection(db, "calls"), {
        from: user.uid,
        fromName: user.displayName || user.email,
        offer: { type: offer.type, sdp: offer.sdp },
        status: "ringing",
        createdAt: serverTimestamp()
      });
    } catch (err) { endLocal("Panggilan gagal dimulai. Coba lagi."); return; }
    if (!pc) { updateDoc(ref, { status: "ended" }).catch(() => {}); return; }   // dibatalkan sebelum terkirim
    callRef = ref; callId = ref.id; handled.add(callId);
    flushOut();
    watchCall();
    ringTimer = setTimeout(() => { if (pc && role === "caller") hangUp("Tidak dijawab.", "missed"); }, 45000);
  }

  /* ----- Panggilan masuk ----- */
  function showIncoming(id, data) {
    incoming = { id, data };
    showOverlay({ name: data.fromName || "Teman", status: "Panggilan video masuk", ringing: true });
    document.title = "Panggilan masuk";
    if (navigator.vibrate) navigator.vibrate([300, 200, 300, 200, 300]);
  }
  function hideIncoming() {
    incoming = null;
    document.title = origTitle;
    if (!pc) overlay.hidden = true;
  }
  function rejectCall() {
    if (!incoming) return;
    const id = incoming.id;
    handled.add(id);
    updateDoc(doc(db, "calls", id), { status: "rejected" }).catch(() => {});
    hideIncoming();
  }
  async function acceptCall() {
    if (!incoming) return;
    const { id, data } = incoming;
    try { localStream = await getMedia(); } catch (err) { mediaError(err); rejectCall(); return; }
    incoming = null;
    document.title = origTitle;
    handled.add(id); callId = id; callRef = doc(db, "calls", id); role = "callee";
    showOverlay({ name: data.fromName || "Teman", status: "Menyambungkan..." });
    pc = makePc();
    prepareCamButtons();
    try {
      watchCall();
      await pc.setRemoteDescription(data.offer);
      flushIn();
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await updateDoc(callRef, { answer: { type: answer.type, sdp: answer.sdp }, status: "active" });
    } catch (err) { hangUp("Gagal menyambung. Coba lagi."); }
  }

  const stopIncoming = onSnapshot(
    query(collection(db, "calls"), orderBy("createdAt", "desc"), limit(1)),
    snap => {
      const d = snap.docs[0];
      if (!d) return;
      const data = d.data({ serverTimestamps: "estimate" });
      if (data.from === user.uid || d.id === callId) return;
      if (incoming && incoming.id === d.id && data.status !== "ringing") { hideIncoming(); return; }
      const age = data.createdAt ? Date.now() - data.createdAt.toMillis() : 0;
      if (data.status === "ringing" && !pc && !incoming && !handled.has(d.id) && age < 90000) showIncoming(d.id, data);
    },
    () => {}
  );

  /* ----- Tombol kontrol ----- */
  function toggleTrack(kind, btn) {
    if (!localStream) return;
    const tracks = kind === "audio" ? localStream.getAudioTracks() : localStream.getVideoTracks();
    const on = !(tracks[0] && tracks[0].enabled);
    tracks.forEach(t => (t.enabled = on));
    btn.setAttribute("aria-pressed", String(!on));
    if (kind === "video") localV.style.visibility = on ? "visible" : "hidden";
  }
  async function flipCam() {
    if (!pc || !localStream) return;
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: frontCam ? "environment" : "user" } } });
      const nt = s.getVideoTracks()[0];
      const old = localStream.getVideoTracks()[0];
      const sender = pc.getSenders().find(x => x.track && x.track.kind === "video");
      if (sender) await sender.replaceTrack(nt);
      if (old) { localStream.removeTrack(old); old.stop(); }
      localStream.addTrack(nt);
      frontCam = !frontCam;
      localV.srcObject = localStream;
      localV.classList.toggle("back", !frontCam);
    } catch (err) { showStatus("Tidak bisa mengganti kamera."); }
  }

  $("call-btn").onclick = startCall;
  $("btn-hang").onclick = () => hangUp();
  $("btn-accept").onclick = acceptCall;
  $("btn-reject").onclick = rejectCall;
  $("btn-mic").onclick = e => toggleTrack("audio", e.currentTarget);
  $("btn-cam").onclick = e => toggleTrack("video", e.currentTarget);
  $("btn-flip").onclick = flipCam;

  return () => {
    stopIncoming();
    if (callRef) updateDoc(callRef, { status: "ended" }).catch(() => {});
    endLocal();
    if (incoming) hideIncoming();
  };
}

function showStatus(msg) {
  const s = $("status");
  s.textContent = msg;
  s.hidden = false;
  setTimeout(() => (s.hidden = true), 4000);
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
